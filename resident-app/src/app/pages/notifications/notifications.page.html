<ion-content class="notifications-content ion-padding">
  <div class="notifications-container">
    
    <div class="header-title">
      <h2>Notifications and update</h2>
      <p>Track your submitted complaintts</p>
    </div>

    <div class="notif-banner" *ngIf="unreadCount > 0">
      <span>There is {{ unreadCount }}New update in your complaints!</span>
      <ion-button size="small" (click)="markAllAsRead()">Mark as read</ion-button>
    </div>

   
    <div *ngIf="notifications.length === 0" class="empty-state">
      <ion-icon name="notifications-circle-outline"></ion-icon>
      <h3>Nothing here</h3>
      <p>No update on your complaints .</p>
    </div>

    
    <div *ngIf="notifications.length > 0" class="notification-list">
      <div *ngFor="let item of notifications" class="notification-card" [ngClass]="{'unread': !item.read}">
        <div class="card-icon" [ngClass]="{
          'pending-icon': item.status === 'Pending',
          'progress-icon': item.status === 'In Progress' || item.status === 'Ongoing',
          'resolved-icon': item.status === 'Resolved'
        }">
          <ion-icon name="alert-circle-outline"></ion-icon>
        </div>
        <div class="card-details">
          <div class="card-header-row">
            <h4>{{ item.title }}</h4>
            <span class="status-tag" [ngClass]="{
              'pending': item.status === 'Pending',
              'progress': item.status === 'In Progress' || item.status === 'Ongoing',
              'resolved': item.status === 'Resolved'
            }">
              {{ item.status }}
            </span>
          </div>
          <p>{{ item.message }}</p>
          <small *ngIf="item.time || item.created_at">{{ item.time || (item.created_at | date:'medium') }}</small>
        </div>
      </div>
    </div>

  </div>
</ion-content>

<div class="fb-fixed-footer">
  <div class="fb-nav-container">
    
    <button type="button" class="fb-nav-btn" (click)="goToHome()">
      <ion-icon name="home-outline"></ion-icon>
      <span>Home</span>
    </button>

    <button type="button" class="fb-nav-btn" (click)="goToComplaint()">
      <ion-icon name="document-text-outline"></ion-icon>
      <span>Complaints</span>
    </button>

    <button type="button" class="fb-nav-btn" (click)="goToMyComplaints()">
      <ion-icon name="list-outline"></ion-icon>
      <span>List</span>
    </button>

   
    <button type="button" class="fb-nav-btn active-btn notification-tab-btn" (click)="goToNotifications()">
      <div class="icon-wrapper">
        <ion-icon name="notifications-outline"></ion-icon>
        <span class="fb-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </div>
      <span>Notification</span>
    </button>

    <button type="button" class="fb-nav-btn" (click)="goToProfile()">
      <ion-icon name="person-outline"></ion-icon>
      <span>Profile</span>
    </button>

  </div>
</div>
