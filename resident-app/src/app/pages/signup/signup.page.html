<ion-content class="signup-content ion-padding">
  <ion-grid class="ion-height-100 ion-justify-content-center ion-align-items-center">
    <ion-row class="ion-justify-content-center ion-align-items-center" style="height: 100%;">
      <ion-col size="12" size-sm="8" size-md="6" size-lg="4">
        
        <div class="signup-container">
          <div class="signup-header">
            <h2>Resident Registration</h2>
            
          </div>

          <div>
            <ion-item lines="solid" class="custom-item">
              <ion-input 
                label="Full Name" 
                labelPlacement="floating" 
                type="text" 
                [(ngModel)]="fullName"
                name="fullName"
                placeholder="Full Name">
              </ion-input>
            </ion-item>

            
            <ion-item lines="solid" class="custom-item" style="margin-top: 12px;">
              <ion-input 
                label="Phone Number" 
                labelPlacement="floating" 
                type="tel" 
                [(ngModel)]="phoneNumber"
                name="phoneNumber"
                placeholder="09XXXXXXXXX">
              </ion-input>
            </ion-item>

            
            <ion-item lines="solid" class="custom-item" style="margin-top: 12px;">
              <ion-input 
                label="Email Address" 
                labelPlacement="floating" 
                type="email" 
                [(ngModel)]="email"
                name="email"
                placeholder="input email">
              </ion-input>
            </ion-item>

            <!-- Password -->
            <ion-item lines="solid" class="custom-item" style="margin-top: 12px;">
              <ion-input 
                label="Password" 
                labelPlacement="floating" 
                type="password" 
                [(ngModel)]="password"
                name="password"
                placeholder="password">
                <ion-input-password-toggle slot="end"></ion-input-password-toggle>
              </ion-input>
            </ion-item>

           
            <button type="button" class="standard-submit-btn" (click)="onRegister()">
              Register
            </button>

            
            <button type="button" class="standard-login-btn" (click)="goToLogin()">
              Already have an account? login
            </button>
          </div>
        </div>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
