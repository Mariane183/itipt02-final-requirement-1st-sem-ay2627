<ion-content class="login-content ion-padding">
  <ion-grid class="ion-height-100 ion-justify-content-center ion-align-items-center">
    <ion-row class="ion-justify-content-center ion-align-items-center" style="height: 100%;">
      <ion-col size="12" size-sm="8" size-md="6" size-lg="4">
        
        <div class="login-container">
          <div class="login-header">
            <h2>Resident Login</h2>
            <p>Login to manage your complaints</p>
          </div>

          <div>
           
            <ion-item lines="solid" class="custom-item">
              <ion-input 
                label="Full Name" 
                labelPlacement="floating" 
                type="text" 
                [(ngModel)]="username"
                name="username"
                placeholder="Fullnme">
              </ion-input>
            </ion-item>

           
            <ion-item lines="solid" class="custom-item" style="margin-top: 12px;">
              <ion-input 
                label="Password" 
                labelPlacement="floating" 
                type="password" 
                [(ngModel)]="password"
                name="password"
                placeholder="Input password">
                <ion-input-password-toggle slot="end"></ion-input-password-toggle>
              </ion-input>
            </ion-item>

            
            <button type="button" class="standard-submit-btn" (click)="onLogin()">
              Login
            </button>

            
            <button type="button" class="standard-signup-btn" (click)="goToSignup()">
              No account? Register here
            </button>
          </div>
        </div>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
