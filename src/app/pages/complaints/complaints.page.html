<ion-content class="complaint-content">
  <div class="complaint-container">
    
    <div class="header-title">
      <h2>Maghain ng Reklamo</h2>
      <p>Isumite ang iyong reklamo sa barangay</p>
    </div>

    <div class="form-card">
      
      <!-- Pangalan ng Inirereklamo -->
      <ion-item class="custom-item">
        <ion-input label="Pangalan ng Inirereklamo" labelPlacement="stacked" [(ngModel)]="respondentName" placeholder="Ilagay ang pangalan"></ion-input>
      </ion-item>

      <!-- Detalye ng Reklamo -->
      <ion-item class="custom-item">
        <ion-textarea label="Detalye ng Reklamo" labelPlacement="stacked" [(ngModel)]="complaintDetails" placeholder="Ikwento ang pangyayari..." rows="4"></ion-textarea>
      </ion-item>

      <!-- Evidence / Camera Section -->
      <div class="evidence-section">
        <!-- Hidden file input na tumatanggap ng camera capture o pagpipilian ng file -->
        <input #fileInput type="file" accept="image/*" capture="environment" id="fileInput" style="display: none;" (change)="onFileSelected($event)">
        
        <button type="button" class="camera-btn" (click)="fileInput.click()">
          <ion-icon name="camera-outline"></ion-icon>
          <span>Maglakip o Kumuha ng Larawan (Ebidensya)</span>
        </button>

        <!-- Preview ng Naka-upload o Nakuha na Larawan -->
        <div class="image-preview-box" *ngIf="evidenceImage">
          <img [src]="evidenceImage" alt="Evidence Preview" />
          
          <button type="button" class="remove-img-btn" (click)="removePhoto()">
            <ion-icon name="trash-outline"></ion-icon>
            <span>Tanggalin ang Larawan</span>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="button" class="standard-submit-btn" (click)="onSubmitComplaint()">
        <ion-icon name="send-outline"></ion-icon>
        <span>Isumite ang Reklamo</span>
      </button>

    </div>
  </div>
</ion-content>

<!-- Fixed Bottom Navigation Bar (Facebook-style) -->
<div class="fb-fixed-footer">
  <div class="fb-nav-container">
    
    <button type="button" class="fb-nav-btn" (click)="goToHome(); $event.stopPropagation()">
      <ion-icon name="home-outline"></ion-icon>
      <span>Home</span>
    </button>

    <button type="button" class="fb-nav-btn active-btn" (click)="goToComplaint(); $event.stopPropagation()">
      <ion-icon name="document-text-outline"></ion-icon>
      <span>Reklamo</span>
    </button>

    <button type="button" class="fb-nav-btn" (click)="goToMyComplaints(); $event.stopPropagation()">
      <ion-icon name="list-outline"></ion-icon>
      <span>Listahan</span>
    </button>

    <button type="button" class="fb-nav-btn" (click)="goToNotifications(); $event.stopPropagation()">
      <div class="icon-wrapper" style="position: relative; display: flex; align-items: center; justify-content: center;">
        <ion-icon name="notifications-outline"></ion-icon>
        <span class="fb-badge" *ngIf="unreadCount > 0" style="position: absolute; top: -6px; right: -10px; background-color: #e11d48; color: #ffffff; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 10px; border: 2px solid #ffffff; min-width: 16px; text-align: center;">{{ unreadCount }}</span>
      </div>
      <span>Abiso</span>
    </button>

    <button type="button" class="fb-nav-btn" (click)="goToProfile(); $event.stopPropagation()">
      <ion-icon name="person-outline"></ion-icon>
      <span>Profile</span>
    </button>

  </div>
</div>
